<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .auth-wrapper {
            width: min(900px, 100%);
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }
        .auth-card {
            background: #2b2b2b;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .auth-card h1 {
            font-size: 20px;
        }
        .auth-card p {
            color: #cfcfcf;
            font-size: 13px;
            line-height: 1.4;
        }
        .auth-link {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(90deg, #7c3aed, #ff8c42);
            color: #ffffff;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 999px;
            text-align: center;
        }
        .auth-link.secondary {
            background: #3a3a3a;
        }
        .back-link {
            text-align: center;
            color: #bdbdbd;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Accedi</h1>
            <p>Inserisci le tue credenziali per accedere al tuo account e salvare la configurazione.</p>
            <a class="auth-link" href="login.html">Vai ad Accedi</a>
        </div>
        <div class="auth-card">
            <h1>Crea un account</h1>
            <p>Registrati in pochi passaggi per salvare i tuoi build e monitorare gli acquisti.</p>
            <a class="auth-link secondary" href="create-account.html">Vai a Crea un account</a>
        </div>
        <a class="back-link" href="index.html">Torna alla home</a>
    </div>
</body>
</html>
