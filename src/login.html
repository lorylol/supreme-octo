<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #1f1f1f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .form-card {
            width: min(520px, 100%);
            background: #2b2b2b;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.4);
            display: grid;
            gap: 16px;
        }
        .form-card h1 {
            font-size: 22px;
        }
        .form-card p {
            color: #cfcfcf;
            font-size: 13px;
        }
        label {
            font-size: 13px;
            color: #bdbdbd;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: none;
            background: #1a1a1a;
            color: #ffffff;
        }
        .actions {
            display: grid;
            gap: 10px;
        }
        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(90deg, #7c3aed, #ff8c42);
            color: #ffffff;
        }
        .link {
            text-align: center;
            text-decoration: none;
            color: #bdbdbd;
            font-size: 12px;
        }

        .form-message {
            font-size: 12px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #cfcfcf;
            text-align: center;
        }

        .form-message.error {
            background: rgba(231, 76, 60, 0.18);
            color: #ffb3ad;
        }
    </style>
</head>
<body>
    <form class="form-card" id="loginForm">
        <h1>Accedi</h1>
        <p>Inserisci mail e password per entrare nel tuo account.</p>
        <div class="form-message" id="formMessage" aria-live="polite"></div>
        <div>
            <label for="email">Mail</label>
            <input id="email" type="email" placeholder="nome@email.com" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="La tua password" required>
        </div>
        <div class="actions">
            <button class="btn" type="submit">Accedi</button>
            <a class="link" href="auth.html">Torna alla scelta account</a>
        </div>
    </form>

    <script>
        const STORAGE_KEYS = {
            users: 'supremeOctoUsers',
            currentUser: 'supremeOctoCurrentUser'
        };

        const form = document.getElementById('loginForm');
        const message = document.getElementById('formMessage');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            const stored = localStorage.getItem(STORAGE_KEYS.users);
            const users = stored ? JSON.parse(stored) : [];
            const user = users.find(item => item.email === email && item.password === password);

            if (!user) {
                message.textContent = 'Credenziali non valide.';
                message.className = 'form-message error';
                return;
            }

            localStorage.setItem(STORAGE_KEYS.currentUser, JSON.stringify({
                firstName: user.firstName,
                lastName: user.lastName,
                email: user.email
            }));

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
